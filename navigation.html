<script>
(()=>{const names={index:['Home','首页'],research:['Research','研究'],teaching:['Teaching','教学'],'urban-memory':['Urban Memory','城市记忆'],cv:['CV','简历'],personal:['Beyond Economics','学术之外'],contact:['Contact','联系']};const file=location.pathname.split('/').pop()||'index.html';const zh=file.includes('-zh.');const stem=file.replace(/-zh(?=\.)/,'').replace(/\.html$/,'');const section=stem==='family-history'?'personal':stem;document.documentElement.lang=zh?'zh-CN':'en';document.querySelectorAll('.navbar-nav .nav-link').forEach(a=>{const f=new URL(a.href).pathname.split('/').pop()||'index.html';if(f==='index-zh.html'){a.href=(names[section]?stem:'index')+(zh?'':'-zh')+'.html';a.textContent=zh?'English':'中文';a.hreflang=zh?'en':'zh-CN';a.setAttribute('aria-label',zh?'Read this page in English':'以中文阅读本页');a.classList.remove('active');return}const k=f.replace(/\.html$/,'');if(names[k]){a.href=k+(zh?'-zh':'')+'.html';a.textContent=names[k][zh?1:0];a.classList.toggle('active',k===section);if(k===stem)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}});const brand=document.querySelector('.navbar-brand');if(brand)brand.href=zh?'index-zh.html':'index.html';})();
</script>
