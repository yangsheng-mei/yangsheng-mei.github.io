function nav(n){view=n;filter={q:'',c:'全部案例',m:'全部方法'};location.hash='p'+n;render();window.scrollTo(0,0)}function intro(title,desc){return '<div class="pageintro"><div class="eyebrow">URBAN MEMORY / LIVING ARCHIVE</div><h1>'+title+'</h1><p>'+desc+'</p></div>'}function card(r,featured=false){return '<article class="card">'+(featured?'<div class="casebanner '+(r.case==='Oregon HB2001'?'oregon':'')+'"></div>':'')+'<div class="meta">'+badge(r.status)+'<span>'+esc(r.case)+' · '+esc(r.method)+'</span>'+(r.visibility==='仅管理'?'<span>仅管理</span>':'')+'</div><h3>'+esc(r.title)+'</h3><p>'+esc(r.body)+'</p>'+(r.next?'<div class="next"><strong>NEXT QUESTION / 下一步</strong>'+esc(r.next)+'</div>':'')+'<div class="cardbottom"><span>'+esc(r.kind)+(r.date?' · '+esc(r.date):'')+'</span><span>'+(url(r.url)?'<a href="'+esc(url(r.url))+'" target="_blank" rel="noopener noreferrer">查看来源 ↗</a> ':'')+'<button class="manage" data-edit="'+esc(r.id)+'">编辑 ↗</button></span></div></article>'}
function filters(){return '<div class="filters"><input id="search" aria-label="搜索档案" placeholder="搜索标题、内容或下一步…" value="'+esc(filter.q)+'"><select id="casefilter" aria-label="按案例筛选">'+opt(['全部案例',...cases],filter.c)+'</select><select id="methodfilter" aria-label="按方法筛选">'+opt(['全部方法',...methods],filter.m)+'</select></div>'}function matched(rs){return rs.filter(r=>(filter.c==='全部案例'||r.case===filter.c)&&(filter.m==='全部方法'||r.method===filter.m)&&[r.title,r.body,r.next].join(' ').toLowerCase().includes(filter.q.toLowerCase()))}function collection(rs){let a=matched(rs);return '<div id="results" class="grid">'+(a.length?a.map(r=>card(r)).join(''):'<div class="empty">暂无公开记录，或没有匹配项。可调整筛选条件。</div>')+'</div>'}
const map='<div class="map"><svg viewBox="0 0 500 330" aria-label="城市空间与历史痕迹的概念示意图，非真实地理数据" role="img"><defs><pattern id="grid" width="62" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><path d="M 0 0 H62 V46 H0Z" fill="none" stroke="#cdd3c2" stroke-width="8"/><rect x="12" y="11" width="34" height="23" fill="#d9dece"/></pattern></defs><rect width="500" height="330" fill="url(#grid)"/><path d="M370 -10 Q280 80 360 160 T330 340" fill="none" stroke="#bbcfc2" stroke-width="30"/><path d="M-10 265 L170 180 L260 205 L410 122 L520 140" stroke="#f5f3e9" stroke-width="17" fill="none"/><path d="M80 250 L180 200 L175 100 L298 70 L362 134 L320 228 L180 200" fill="none" stroke="#4e725b" stroke-width="3"/><path d="M180 200 L110 110 L20 135 M320 228 L420 290" fill="none" stroke="#a68d60" stroke-width="2" stroke-dasharray="6 6"/><g fill="#f8f5ea" stroke="#4e725b" stroke-width="3"><circle cx="80" cy="250" r="6"/><circle cx="180" cy="200" r="7"/><circle cx="175" cy="100" r="6"/><circle cx="298" cy="70" r="6"/><circle cx="362" cy="134" r="6"/><circle cx="320" cy="228" r="6"/></g><g font-size="10" fill="#48614b" font-family="Arial"><text x="190" y="88">TRACES</text><text x="330" y="250">POSSIBILITIES</text><text x="62" y="95">INHERITED CITY</text></g></svg><div class="legend">● 空间 · ━ 联系 · ┄ 未知</div><div class="maplabel">CONCEPTUAL LANDSCAPE / 概念示意，非实测地图</div></div>';
function home(){let rs=visible();return '<section class="hero"><div><div class="eyebrow">A LIVING RESEARCH PROJECT · SINCE 2026</div><h1>The city remembers.<br><em>What becomes possible?</em></h1><div class="lead">继承的空间，如何塑造可建构的人生？</div><p>从城市留下的痕迹出发，研究人们能够做什么、如何理解所在之地，以及实践与关系如何延续。这里记录问题的形成，也保留尚未找到的答案。</p><div class="actions"><button class="solid" data-nav="2">探索研究案例 →</button><button data-nav="9">参与这场研究 ↗</button></div></div>'+map+'</section><div class="stats"><div class="stat"><b>02</b><span>案例研究 / CASES</span></div><div class="stat"><b>04</b><span>候选方法 / METHODS</span></div><div class="stat"><b>'+String(rs.filter(r=>r.kind==='开放假设'||r.kind==='待验证').length).padStart(2,'0')+'</b><span>开放问题 / OPEN</span></div><div class="stat"><b>↗</b><span>持续更新 / IN PROGRESS</span></div></div><div class="sectionhead"><h2>从具体的城市变化开始</h2><button class="textbutton" data-nav="2">全部研究卡片 ↗</button></div><div class="grid">'+rs.filter(r=>['c1','c2'].includes(r.id)).map(r=>card(r,true)).join('')+'</div><div class="sectionhead"><h2>一套仍在构建的概念语言</h2><span class="eyebrow">WORKING DEFINITIONS</span></div><div class="concepts">'+[['Opportunity set','特定时间与约束下，个人真正能够采取哪些行动？'],['Consequence set','结果依赖谁的选择？可能实现不等于个人能够保证。'],['Traces','建筑、制度与实践留下什么？痕迹是候选载体，而非集合元素。'],['Legibility','哪些历史被看见、被理解？认知、评价与可行性需要区分。'],['Transmission','知识、意义与参与方式如何跨人群与代际传递？'],['Reproduction','什么条件使实践能够再次发生，而不只是被保存？']].map(([t,d])=>'<div class="concept"><b>'+t+'</b><p>'+d+'</p></div>').join('')+'</div><div class="note">研究边界：以上概念关系属于工作框架。案例中的机制与因果效应尚未确立；研究将允许证据改变假设，也允许结果不支持最初的直觉。</div>'}
function board(){let rs=visible().filter(r=>r.kind==='任务');return intro('研究进度','把开放问题转化为可执行的下一步。每项任务保留关联案例、方法与下一步。')+'<div class="board">'+['待办','进行中','待验证','已完成'].map(s=>'<section class="column"><h3>'+s+' · '+rs.filter(r=>r.status===s).length+'</h3>'+rs.filter(r=>r.status===s).map(r=>'<div>'+card(r)+'<select class="manage" aria-label="变更 '+esc(r.title)+' 的状态" data-move="'+esc(r.id)+'">'+opt(['待办','进行中','待验证','已完成'],r.status)+'</select></div>').join('')+'</section>').join('')+'</div>'}
function participate(){let u=url(data.settings.surveyUrl),contact=url(data.settings.contactUrl);return intro('参与研究','让问题与真实的城市经验相遇。')+'<section class="participate"><div class="eyebrow">SHARE A PLACE. OPEN A QUESTION.</div><h2>一个地方的改变，<br>曾让你失去或获得什么可能？</h2><p>我们希望理解空间变化如何影响人的行动、关系与地方经验。你可以在问卷开放后分享经历，也可以提供数据、文献或合作线索。</p>'+ (u?'<a class="solid" style="display:inline-block;padding:11px 20px;border-radius:4px;text-decoration:none" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">前往外部问卷 ↗</a>':'<span class="badge pending">问卷筹备中 · 暂未开放收集</span>')+(contact?'<p><a href="'+esc(contact)+'" target="_blank" rel="noopener noreferrer">联系与合作入口 ↗</a></p>':'')+'</section><div class="grid" style="margin-top:20px"><div class="card"><h3>分享城市经验</h3><p>关注曾经可行的活动、持续或中断的关系，以及对同一地方的不同理解。具体参加条件和知情说明以正式问卷为准。</p></div><div class="card"><h3>带来资料与研究线索</h3><p>欢迎规划历史、地方档案、空间数据与测量建议。合作关系需双方确认，不会因提供线索而被自动列为合作者。</p></div></div><div class="note">本页不直接采集问卷答案。外部问卷由其服务方托管；参与前请阅读问卷内的知情说明。嵌入若被服务方阻止，可直接通过链接打开。</div>'+(u&&data.settings.embed?'<iframe title="外部研究问卷" src="'+esc(u)+'" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>':'')+'<section class="manage"><div class="sectionhead"><h2>参与入口设置</h2></div><form class="settings" id="settings"><label>外部问卷地址（HTTPS）<input type="url" name="surveyUrl" value="'+esc(data.settings.surveyUrl)+'" placeholder="https://…"></label><label class="check"><input type="checkbox" name="embed" '+(data.settings.embed?'checked':'')+'> 同时嵌入问卷（须服务方允许）</label><label>联系或合作表单地址（HTTPS）<input type="url" name="contactUrl" value="'+esc(data.settings.contactUrl)+'" placeholder="https://…"></label><button class="solid">保存参与入口</button></form></section>'}
function render(){if(!data)return;$('#nav').innerHTML=pages.map((p,i)=>'<button data-nav="'+i+'" class="'+(i===view?'active':'')+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+p+'</button>').join('');$('#breadcrumb').textContent=pages[view];document.body.classList.toggle('presentation',showcase);let html='',rs=visible();if(view===0)html=home();else if(view===4)html=board();else if(view===8)html=intro('版本更新日志','保留研究发展的路径：定义如何调整、假设如何更新、证据如何积累。')+'<div class="timeline">'+data.logs.filter(l=>!showcase||l.visibility!=='仅管理').map(l=>'<article class="event"><small>'+esc(l.date)+'</small><h3>'+esc(l.title)+'</h3><p>'+esc(l.body)+'</p></article>').join('')+'</div><div class="actions manage"><button id="export">导出完整档案 JSON ↓</button></div>';else if(view===9)html=participate();else{let groups={1:['研究问题','开放假设'],2:['研究卡片','研究结果'],3:['数据','文献'],5:['待验证'],6:['会议'],7:['合作者']};let desc={1:'假设是可以被证据推翻的命题。这里保留概念边界与竞争性解释。',2:'按案例与方法浏览设计、机制和研究结果。方法标签代表候选设计，不代表识别已经成立。',3:'区分候选来源、待核验材料与已完成阅读。为每条资源持续补充链接、版本和用途。',5:'把识别假设、测量难题与证据缺口明确写下来。',6:'记录讨论、反馈及下一步。此处只展示经作者选定的公开讨论摘要；私人纪要不随网站发布。',7:'记录研究兴趣、潜在贡献和双方确认的合作状态。当前未预设任何已确认合作者。'};html=intro(pages[view],desc[view])+filters()+collection(rs.filter(r=>groups[view].includes(r.kind)))}$('#content').innerHTML=html+'<footer class="lowerfooter"><span>URBAN MEMORY · YANGSHENG MEI</span><span>Working knowledge, open questions.</span></footer>';bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(+b.dataset.nav));['search','casefilter','methodfilter'].forEach(id=>{let el=$('#'+id);if(el)el.oninput=()=>{let pos=el.selectionStart;filter={q:$('#search').value,c:$('#casefilter').value,m:$('#methodfilter').value};render();let ne=$('#'+id);ne.focus();if(id==='search')ne.setSelectionRange(pos,pos)}})}
let initial=Number(location.hash.slice(2));if(initial>=0&&initial<pages.length)view=initial;load();
</script></body></html>
